name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  BACKEND_IMAGE: tiendaonline-backend
  FRONTEND_IMAGE: tiendaonline-frontend

jobs:
  docker-build-push:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Configurar en GitHub: Settings > Secrets and variables > Actions
      # DOCKER_USERNAME: usuario de Docker Hub.
      # DOCKER_PASSWORD: token o password de Docker Hub.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./OnlineStoreApp
          file: ./OnlineStoreApp/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL || 'http://localhost:8080/OnlineStoreApp' }}
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-placeholders:
    name: Deployment Placeholders
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      # Configurar en GitHub: Settings > Secrets and variables > Actions
      # RENDER_API_KEY: API Key de Render.
      # RAILWAY_TOKEN: token de Railway.
      # Tambien se recomienda guardar IDs de servicios como variables:
      # RENDER_BACKEND_SERVICE_ID, RENDER_FRONTEND_SERVICE_ID o RAILWAY_PROJECT_ID.
      - name: Render deployment placeholder
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Render listo para despliegue automatizado usando RENDER_API_KEY."
          echo "Agregar aqui la llamada a la API de Render cuando existan los Service IDs."

      - name: Railway deployment placeholder
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Railway listo para despliegue automatizado usando RAILWAY_TOKEN."
          echo "Agregar aqui comandos de Railway CLI o API cuando el proyecto este configurado."
